<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 7 | web development</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sports Athlete Registration</h1>

    <div class="registationForm">
      <form id="form" action="action.html" method="get">
        <fieldset>
          <legend>Personal Information</legend>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="enter name"  required/>
          <br />
          <label for="readonly">Sport Player:</label>
          <input type="text" id="readonly" name="readonly" value="Yes"  required readonly/>
          <br />

          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="enter email"
            required
          />
          <br />

          <label for="gender">Gender:</label>
          <input type="radio" id="male" name="gender" value="male" required />
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female" required />
          <label for="female">Female</label>
          <input type="radio" id="other" name="gender" value="other" required />
          <label for="other">Other</label>

          <br />

          <label for="DOB">Date of Birth:</label>
          <input type="date" id="DOB" name="DOB" required />
          <br>

          <lable for="time">Current Time:</lable>
          <input type="time" id="time" name="time" required />
        </fieldset>

        <fieldset>
          <legend>Medical History of Athlete</legend>
          <label for="allergies">Allergies:</label>
          <input
            type="text"
            id="allergies"
            name="allergies"
            placeholder="enter allergies"
          />
          <br />
          <label for="medications">Medications:</label>
          <input
            type="text"
            id="medications"
            name="medications"
            placeholder="enter medications"
          />
          <br />
          <label for="disability">Disability:</label>
          <input
            type="radio"
            id="disability"
            name="disability"
            value="yes"
          />
          <label for="disability">Yes</label>
          <input
            type="radio"
            id="disability"
            name="disability"
            value="no"
          />
          <label for="disability">No</label>
          <br />
          <label for="concussion-history">History of Concussions:</label>
          <input
            type="radio"
            id="concussion-history"
            name="concussion-history"
            value="yes"
            required
          />
          <label for="concussion-history">Yes</label>
          <input
            type="radio"
            id="concussion-history"
            name="concussion-history"
            value="no"
            required    
          />
          <label for="concussion-history">No</label>
        </fieldset>
        <br />

        <fieldset>
          <legend>Fitness Assignment</legend>
          <label for="fitness-level">Fitness Level:</label>
          <select id="fitness-level" name="fitness-level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>

          <label for="textarea">Enter your Experience(Optional): </label>
          <textarea name="textarea" id="" placeholder="Enter any additional information..."></textarea>

          <br>
          <label id="file-label" for="file">Upload Document: </label>
          <br>
          <input type="file" id="file" name="file" required accept=".pdf,.html" />

          <br>

          <label for="state">Select State:</label>
          <select id="state" name="state" required>
            <option value="">-- Select --</option>
            <option value="PB">Panjab</option>
            <option value="ND">New Delhi</option>
            <option value="BR">Bihar</option>
            <option value="TX">Tamil Nadu</option>
            <option value="TN">Tamil Nadu</option>
            <option value="KL">Kerala</option>
            </select>

            <label for="depression">Depression Level:</label>
            <input type="range" id="depression" name="depression" min="0" max="10" required />

        </fieldset>

        <fieldset>
          <legend>Tabular Data:</legend>
          <table>
            <th>
              <tr>
                <th>Code</th>
                <th>Name</th>
                <th>Job Title</th>
                <th>Salary(LPA)</th>
              </tr>
            </th>
            <tbody>
              <tr>
                <td>001</td>
                <td>John Doe</td>
                <td>Software Engineer</td>
                <td>10</td>
              </tr>
              <tr>
                <td>002</td>
                <td>Jane Smith</td>
                <td>Data Scientist</td>
                <td>12</td>
              </tr>
              <tr>
                <td>003</td>
                <td>Michael Johnson</td>
                <td>Product Manager</td>
                <td>15</td>
              </tr>
            </tbody>
            <tfoot>
              <tr>
                <td colspan="3"><strong>Total</strong></td>
                <td><strong>37</strong></td>
              </tr>
            </tfoot>
          </table>
        </fieldset>

        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms" id="terms">I agree to the terms and conditions</label>
<br>
        <button type="submit">Register</button>
        <button type="reset">Reset</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
