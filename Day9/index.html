<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Html</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>EMP Code</th>
                <th>Emp Name</th>
                <th>JOb Title</th>
                <th>Salary(LPA)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>001</td>
                <td>John Doe</td>
                <td>Software Engineer</td>
                <td>10</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Jane Smith</td>
                <td>Data Scientist</td>
                <td>12</td>
            </tr>
            <tr>
                <td>003</td>
                <td>Michael Johnson</td>
                <td>Product Manager</td>
                <td>15</td>
            </tr>
            <tr>
                <td>004</td>
                <td>Sarah Williams</td>
                <td>UX Designer</td>
                <td>14</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><strong>Total</strong></td>
                <td><strong>51</strong></td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
