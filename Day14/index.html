<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>

    <style>
        body{
            box-sizing: border-box;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;
            background: linear-gradient(45deg, rgb(185, 147, 41), rgb(224, 182, 182));
            border: 10px solid transparent;
            border-radius: 20px;
            background:
            linear-gradient(white, white) padding-box,
            linear-gradient(25deg, red, green) border-box;
            
        }  

        p{
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            border-radius: 20px;
        }

        .item1{
            align-self: flex-start;
            box-shadow: 2px 4px 6px green;

        }

        .item2{
            box-shadow: 2px 4px 6px red;
        }

        .item3{
            align-self: flex-end;
            box-shadow: 2px 4px 6px orange;
        }

        .item4{
            box-shadow: 2px 4px 6px indigo;
        }
        .item5{
            align-self: flex-start;
            box-shadow: 2px 4px 6px blue;

        }
    </style> 
</head>
<body>

    <div class="container">
        <p class="item1">item 1</p>
        <p class="item2">item 2</p>
        <p class="item3">item 3</p>
        <p class="item4">item 4</p>
        <p class="item5">item 5</p>
    </div>
    
</body>
</html>
